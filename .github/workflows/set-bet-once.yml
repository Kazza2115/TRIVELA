name: Set bet once (ponctuel)
on:
  push:
    branches: [claude/jolly-archimedes-53jcrc, claude/world-cup-qualifiers-update-z9ehtl]
    paths: ['scripts/set-bet-once.mjs', '.github/workflows/set-bet-once.yml']
  workflow_dispatch:
jobs:
  setbet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # KAZA · Mexique-Équateur (16es / r32-11) : Mexique 1 - Équateur 0.
      #   Orientation match MEX(dom) vs ECU(ext) : home(MEX)=1, away(ECU)=0.
      - run: node scripts/set-bet-once.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BET_PSEUDO: 'KAZA'
          BET_MATCH_ID: 'r32-11'
          BET_HOME_NAME: 'Mexique'
          BET_AWAY_NAME: 'Équateur'
          BET_HOME: '1'
          BET_AWAY: '0'
          BET_STAGE: '16es de finale'
