name: Set bet once (ponctuel)
on:
  push:
    branches: [claude/jolly-archimedes-53jcrc, claude/world-cup-qualifiers-update-z9ehtl]
    paths: ['scripts/set-bet-once.mjs', '.github/workflows/set-bet-once.yml']
  workflow_dispatch:
jobs:
  setbet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # KAZA · Angleterre-Argentine (demi-finale / sf-2) : Argentine gagne 2-0.
      #   Orientation match ENG(dom) vs ARG(ext) : home(ENG)=0, away(ARG)=2.
      - run: node scripts/set-bet-once.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BET_PSEUDO: 'KAZA'
          BET_MATCH_ID: 'sf-2'
          BET_HOME_NAME: 'Angleterre'
          BET_AWAY_NAME: 'Argentine'
          BET_HOME: '0'
          BET_AWAY: '2'
          BET_STAGE: 'Demi-finale'
