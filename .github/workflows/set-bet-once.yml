name: Set bet once (ponctuel)
on:
  push:
    branches: [claude/jolly-archimedes-53jcrc, claude/world-cup-qualifiers-update-z9ehtl]
    paths: ['scripts/set-bet-once.mjs', '.github/workflows/set-bet-once.yml']
  workflow_dispatch:
jobs:
  setbet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dyran · Côte d'Ivoire-Norvège (16es / r32-10) : prono NUL 1-1, qualifié = Norvège.
      #   Orientation match CIV(dom) vs NOR(ext) : home(CIV)=1, away(NOR)=1, qualifier=NOR.
      - run: node scripts/set-bet-once.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BET_PSEUDO: 'Dyran'
          BET_MATCH_ID: 'r32-10'
          BET_HOME_NAME: "Côte d'Ivoire"
          BET_AWAY_NAME: 'Norvège'
          BET_HOME: '1'
          BET_AWAY: '1'
          BET_QUALIFIER: 'NOR'
          BET_STAGE: '16es de finale'
