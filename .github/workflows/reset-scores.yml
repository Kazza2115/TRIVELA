name: Reset scores (one-off)

on:
  workflow_dispatch:
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/reset-scores.mjs']

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/reset-scores.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
