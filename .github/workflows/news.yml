name: Fetch news

# Récupère les actualités Coupe du Monde et les écrit dans la table Supabase `news`.
on:
  schedule:
    - cron: '*/15 * * * *'   # toutes les 15 minutes
  workflow_dispatch:
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/fetch-news.mjs', '.github/workflows/news.yml']

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch & store news
        run: node scripts/fetch-news.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
