name: Demo results (matchs terminés)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'seed = créer · cleanup = retirer'
        type: choice
        options: [seed, cleanup]
        default: seed
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/demo-results.mjs', '.github/workflows/demo-results.yml']

jobs:
  demo-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/demo-results.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'seed' }}
