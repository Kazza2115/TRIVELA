name: Deploy to Cloudflare Pages

# Déploie le front sur Cloudflare Pages à chaque push (comme GitHub Pages).
# Activé uniquement quand la variable de dépôt DEPLOY_CLOUDFLARE == 'true'
# (et que les secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID sont posés).
on:
  push:
    branches: [claude/resume-codebase-work-i3uAg, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base racine pour le domaine)
        run: npm run build
        env:
          VITE_BASE: '/'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Analytics PostHog (optionnel) : injecté au build. Si le secret est absent,
          # PostHog reste désactivé et seul l'analytics Supabase tourne.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      - name: Create Pages project (idempotent)
        run: npx wrangler@3 pages project create trivela --production-branch="${GITHUB_REF_NAME}" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=trivela --branch="${GITHUB_REF_NAME}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
