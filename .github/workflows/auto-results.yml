name: Auto-update match results

on:
  schedule:
    # Every 30 minutes — only meaningful once WC 2026 starts (Jun 11, 2026)
    - cron: '*/30 * * * *'
  workflow_dispatch:   # Manual trigger for testing

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save --no-package-lock

      - name: Fetch results & settle points
        run: node scripts/update-results.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
