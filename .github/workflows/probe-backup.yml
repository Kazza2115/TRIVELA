name: Probe backup source (TheSportsDB)

# Sonde manuelle : la Coupe du Monde 2026 est-elle dispo sur TheSportsDB
# (source de scores de secours) et les noms sont-ils mappables ?
on:
  workflow_dispatch:
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/probe-backup-source.mjs', '.github/workflows/probe-backup.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save --no-package-lock
      - name: Probe TheSportsDB
        run: node scripts/probe-backup-source.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
