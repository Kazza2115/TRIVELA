name: Audit scores (ponctuel)
on:
  push:
    branches: [claude/jolly-archimedes-53jcrc]
    paths: ['scripts/audit-scores.mjs', '.github/workflows/audit-scores.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-scores.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
