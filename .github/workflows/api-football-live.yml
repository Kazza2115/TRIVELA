name: API-Football live

# ⚠️ Poller live DOUBLON du worker Cloudflare (cloudflare/live-worker.js, cron 1 min).
# Le worker est désormais l'unique poller live programmé (plus ponctuel, ~12 s de
# granularité, gate quota intégré). Ce workflow reste en SECOURS manuel
# (workflow_dispatch) — son cron est volontairement désactivé pour ne pas doubler
# le quota API pendant les matchs.
on:
  workflow_dispatch:
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/api-football-live.mjs', 'scripts/wc-map.mjs', '.github/workflows/api-football-live.yml']

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/api-football-live.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
