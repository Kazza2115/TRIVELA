name: Backup settle (score officiel)
on:
  push:
    branches: [claude/world-cup-qualifiers-update-z9ehtl]
    paths: ['scripts/backup-settle.mjs', '.github/workflows/backup-settle.yml']
  workflow_dispatch:
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup-settle.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
