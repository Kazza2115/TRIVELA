name: Reconcile now (classement)
# Bouton manuel : recalcule profiles.score = somme des points. À lancer si besoin.
on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-archimedes-53jcrc]
    paths: ['scripts/reconcile-now.mjs', '.github/workflows/reconcile-now.yml']
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/reconcile-now.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
