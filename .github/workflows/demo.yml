name: Demo live (classement visible)

# Démo visible dans l'appli : crée 10 joueurs DEMO dont les scores montent
# en direct. Lancer en mode "cleanup" pour tout supprimer ensuite.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = créer la démo · cleanup = tout supprimer'
        type: choice
        options: [live, cleanup]
        default: live
  push:
    branches: [claude/resume-codebase-work-i3uAg]
    paths: ['scripts/demo-live.mjs', '.github/workflows/demo.yml']

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save --no-package-lock
      - name: Run demo
        run: node scripts/demo-live.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'cleanup' }}
