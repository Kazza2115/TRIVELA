name: KO qualifier fix (ponctuel)
on:
  push:
    branches: [claude/world-cup-qualifiers-update-z9ehtl]
    paths: ['scripts/ko-qualifier-fix.mjs', '.github/workflows/ko-qualifier-fix.yml']
  workflow_dispatch:
    inputs:
      apply:
        description: "Écrire le bracket + réconcilier (sinon rapport seul)"
        type: boolean
        default: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ko-qualifier-fix.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '1' || '' }}
