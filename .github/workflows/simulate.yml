name: Simulate tournament (diagnostic)

# Simulation complète du pipeline de paris (10 joueurs, paris aléatoires,
# scores simulés, vérif Realtime + classement, puis nettoyage).
# Déclenchement manuel : Actions → "Simulate tournament" → Run workflow.
on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save --no-package-lock
      - name: Run simulation
        run: node scripts/simulate-tournament.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
